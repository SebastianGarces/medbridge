{% extends "base.html" %}
{% block title %}Login — MedBridge Coach{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-xl border border-[#E5E5E5] p-8 w-[480px]">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center">
                <i data-lucide="heart-pulse" class="w-5 h-5 text-white"></i>
            </div>
            <span class="font-['Newsreader'] text-lg font-medium">MedBridge Coach</span>
        </div>
        <h1 class="font-['Newsreader'] text-2xl font-medium mb-6">Select Demo User</h1>
        <div class="space-y-3">
            {% for patient in patients %}
            <form method="POST" action="/login">
                <input type="hidden" name="user_id" value="{{ patient.id }}">
                <input type="hidden" name="user_type" value="patient">
                <button type="submit" class="w-full text-left px-4 py-3 rounded-lg border border-[#E5E5E5] hover:bg-[#F8F8F8] flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-primary-light flex items-center justify-center text-primary text-sm font-medium">
                        {{ patient.name[0] }}{{ patient.name.split(' ')[-1][0] }}
                    </div>
                    <div>
                        <div class="text-sm font-medium">{{ patient.name }}</div>
                        <div class="text-xs text-[#888888]">Patient</div>
                    </div>
                </button>
            </form>
            {% endfor %}
            {% for clinician in clinicians %}
            <form method="POST" action="/login">
                <input type="hidden" name="user_id" value="{{ clinician.id }}">
                <input type="hidden" name="user_type" value="clinician">
                <button type="submit" class="w-full text-left px-4 py-3 rounded-lg border border-[#E5E5E5] hover:bg-[#F8F8F8] flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-[#1A1A1A] flex items-center justify-center text-white text-sm font-medium">
                        {{ clinician.name[0] }}
                    </div>
                    <div>
                        <div class="text-sm font-medium">{{ clinician.name }}</div>
                        <div class="text-xs text-[#888888]">Clinician</div>
                    </div>
                </button>
            </form>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
