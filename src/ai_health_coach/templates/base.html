<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MedBridge Coach{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0D6E6E',
                        'primary-light': '#E8F5F5',
                        'primary-dark': '#095555',
                        secondary: '#E07B54',
                        'secondary-light': '#FFF3ED',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#FAFAFA] font-['Inter'] text-[#1A1A1A]">
    {% block body %}{% endblock %}
    <script>lucide.createIcons();</script>
</body>
</html>
