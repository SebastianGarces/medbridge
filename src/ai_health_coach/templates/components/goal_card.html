<div class="bg-white rounded-xl border border-[#E5E5E5] p-5">
    <div class="font-['JetBrains_Mono'] text-[11px] font-semibold uppercase tracking-[2px] text-[#888888] mb-3">Goal</div>
    {% if goal %}
    <div class="font-['Newsreader'] text-lg font-medium mb-1">{{ goal.goal_text }}</div>
    {% if goal.target_date %}
    <div class="text-xs text-[#666666] mb-3">Deadline: {{ goal.target_date }}</div>
    {% endif %}
    <div class="w-full h-2 bg-[#F0F0F0] rounded-full mb-1">
        <div class="h-2 bg-primary rounded-full" style="width: {{ goal.progress_pct }}%"></div>
    </div>
    <div class="text-xs text-[#888888]">{{ goal.progress_pct }}% complete</div>
    {% else %}
    <div class="text-sm text-[#888888]">No goal set yet</div>
    {% endif %}
</div>
